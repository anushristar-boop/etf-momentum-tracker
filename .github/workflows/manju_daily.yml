# Manju Rana Dual Engine — daily check (stop-losses, monthly rebalance, Nifty:Gold reshuffle).
# Runs on its own at about 9:35, 10:35, 11:35, 12:35 and 1:35 pm IST (only the first run of the day does the work;
# GitHub sometimes starts scheduled runs late, so there are five tries). Press "Run workflow" to check now.
name: "Manju: daily check"
on:
  schedule:
    - cron: "5 4,5,6,7,8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manju-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install yfinance pandas numpy openpyxl plotly
      - name: Daily check
        env:
          TRADETRON_TOKEN_MANJU: ${{ secrets.TRADETRON_TOKEN_MANJU }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANJU_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python manju_engine.py daily
      - name: Save the record
        if: always()
        run: |
          git config user.name "manju-bot"
          git config user.email "manju-bot@users.noreply.github.com"
          git add manju/state.json
          git diff --cached --quiet || (git commit -m "Manju record update" && git push)
