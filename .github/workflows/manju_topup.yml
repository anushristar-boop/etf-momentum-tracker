# Press after the new money is in her Shoonya account (between 9:20 am and 3:04 pm). Bought at 3:05 pm today.
name: "Manju: top-up"
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Amount added, in rupees (for example 200000)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: manju-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install yfinance pandas numpy openpyxl plotly
      - name: Top-up
        env:
          TRADETRON_TOKEN_MANJU: ${{ secrets.TRADETRON_TOKEN_MANJU }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMOUNT: ${{ inputs.amount }}
        run: python manju_engine.py topup "$AMOUNT"
      - name: Save the record
        if: always()
        run: |
          git config user.name "manju-bot"
          git config user.email "manju-bot@users.noreply.github.com"
          git add manju/state.json
          git diff --cached --quiet || (git commit -m "Manju record update" && git push)
