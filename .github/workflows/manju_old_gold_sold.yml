# Press ONLY after selling her old 3,418 GOLDBEES by hand in Shoonya (when the regime has turned ON).
name: "Manju: old gold sold"
on:
  workflow_dispatch:
    inputs:
      sure:
        description: "Type YES after the 3,418 old GOLDBEES have been sold"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: manju-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install yfinance pandas numpy openpyxl plotly
      - name: Old gold sold
        if: ${{ inputs.sure == 'YES' }}
        env:
          TRADETRON_TOKEN_MANJU: ${{ secrets.TRADETRON_TOKEN_MANJU }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python manju_engine.py oldgold
      - name: Save the record
        if: always()
        run: |
          git config user.name "manju-bot"
          git config user.email "manju-bot@users.noreply.github.com"
          git add manju/state.json
          git diff --cached --quiet || (git commit -m "Manju record update" && git push)
