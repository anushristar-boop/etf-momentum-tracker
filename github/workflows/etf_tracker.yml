name: ETF Momentum Live Tracker
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 12 * * 1-5"      # 18:00 IST on weekdays
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run tracker
        run: python ETF_Momentum_Live_Tracker.py
      - name: Prepare site
        run: |
          mkdir -p site
          cp ETF_Momentum_Tracker_Output/ETF_Momentum_Tracker_Report.html site/index.html
      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: etf-tracker-excel
          path: ETF_Momentum_Tracker_Output/ETF_Momentum_Tracker_Results.xlsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
